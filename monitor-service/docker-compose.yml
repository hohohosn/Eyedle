version: '3.8'
services:
  monitor-db:
    image: postgres:15-alpine
    container_name: monitor-db
    environment:
      POSTGRES_DB: eyedle_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./db/data:/var/lib/postgresql/data