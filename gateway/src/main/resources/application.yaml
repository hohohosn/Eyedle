server:
  port: 19091

spring:
  application:
    name: gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
        routes:
          - id: user-service
            uri: lb://user-service
            predicates:
              - Path=/user/**, /auth/**, /blocks/**
          - id: comment-service
            uri: lb://comment-service
            predicates:
              - Path=/comments/**, /feeds/*/comments/**
          - id: notification-service
            uri: lb://notification-service
            predicates:
              - Path=/notification/**
          - id: chat-service
            uri: lb://chat-service
            predicates:
              - Path=/chats/**
          - id: monitor-service
            uri: lb://monitor-service
            predicates:
              - Path=/monitor/**
          - id: feed-service
            uri: lb://feed-service
            predicates:
              - Path=/feeds/**
#          - id: search-service
#            uri: lb://search-service
#            predicates:
#              - Path=/search/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:19090/eureka/