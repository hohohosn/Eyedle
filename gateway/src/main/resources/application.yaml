server:
  port: 19091

spring:
  application:
    name: gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        # 1. 로그인/회원가입(인증X)
        - id: user-service-auth
          uri: lb://user-service
          predicates:
            - Path=/auth/**

        # 2. 회원서비스(인증O)
        - id: user-service-secured
          uri: lb://user-service
          predicates:
            - Path=/users/**, /blocks/**, /follows/**
          filters:
            - JwtAuthenticationFilter

        # 3. Comment Service
        - id: comment-service
          uri: lb://COMMENT-SERVICE
          predicates:
            - Path=/comments/**, /feeds/*/comments/**
          filters:
            - JwtAuthenticationFilter

        # 4. Notification Service
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/notifications/**
          filters:
            - JwtAuthenticationFilter

        # 5. Chat Service
        - id: chat-service
          uri: lb://CHAT-SERVICE
          predicates:
            - Path=/chats/**
          filters:
            - JwtAuthenticationFilter

        # 6. Monitor Service
        - id: monitor-service
          uri: lb://MONITOR-SERVICE
          predicates:
            - Path=/monitor/**
          filters:
            - JwtAuthenticationFilter

        # 7. Feed Service
        - id: feed-service
          uri: lb://FEED-SERVICE
          predicates:
            - Path=/feeds/**
          filters:
            - JwtAuthenticationFilter

        # 8. Search Service
        - id: search-service
          uri: lb://SEARCH-SERVICE
          predicates:
            - Path=/search/**
          filters:
            - JwtAuthenticationFilter


jwt:
  secret: ${JWT_SECRET_KEY}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:19090/eureka/