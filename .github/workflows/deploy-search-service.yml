name: Deploy Search Service

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'search-service/**'
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        working-directory: search-service
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.INFRA_DOCKER_USERNAME }}
          password: ${{ secrets.INFRA_DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        working-directory: search-service
        run: |
          docker build -t ${{ secrets.INFRA_DOCKER_USERNAME }}/search-service:latest .
          docker push ${{ secrets.INFRA_DOCKER_USERNAME }}/search-service:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.INFRA_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.INFRA_EC2_SSH_KEY }}
          port: 22
          script: |
            sudo docker stop search-service || true
            sudo docker rm search-service || true
            
            sudo docker pull ${{ secrets.INFRA_DOCKER_USERNAME }}/search-service:latest

            sudo docker run -d --name search-service \
              --network host \
              -e "JAVA_TOOL_OPTIONS=-Xms256m -Xmx256m" \
              ${{ secrets.INFRA_DOCKER_USERNAME }}/search-service:latest
            
            sudo docker image prune -f