name: Deploy Notification Service to EC2

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'notification-service/**'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. JDK 17 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Gradle 실행 권한 부여 (notification 폴더 내부)
      - name: Grant execute permission for gradlew
        working-directory: notification-service
        run: chmod +x gradlew

      # 4. Spring Boot 빌드 (테스트 제외)
      - name: Build with Gradle
        working-directory: notification-service
        run: ./gradlew clean build -x test

      # 5. Docker Hub 로그인 (공통 Secret 사용)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.NOTI_DOCKER_USERNAME }}
          password: ${{ secrets.NOTI_DOCKER_PASSWORD }}

      # 6. Docker 이미지 빌드 & 푸시
      - name: Build and Push Docker Image
        working-directory: notification-service
        run: |
          docker build -t ${{ secrets.NOTI_DOCKER_USERNAME }}/notification-service:latest .
          docker push ${{ secrets.NOTI_DOCKER_USERNAME }}/notification-service:latest

      # 7. EC2에 배포 (SSH 접속)
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.NOTI_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.NOTI_EC2_SSH_KEY }}
          port: 22
          script: |
            cd ~/deploy
            
            sudo docker compose pull notification-service
            
            sudo docker compose up -d notification-service
            
            sudo docker image prune -f