name: Deploy Gateway

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'gateway/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        working-directory: gateway
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.INFRA_DOCKER_USERNAME }}
          password: ${{ secrets.INFRA_DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        working-directory: gateway
        run: |
          docker build -t ${{ secrets.INFRA_DOCKER_USERNAME }}/gateway:latest .
          docker push ${{ secrets.INFRA_DOCKER_USERNAME }}/gateway:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.INFRA_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.INFRA_EC2_SSH_KEY }}
          port: 22
          script: |
            sudo docker stop gateway || true
            sudo docker rm gateway || true
            
            pkill -f gateway.jar || true

            sudo docker pull ${{ secrets.INFRA_DOCKER_USERNAME }}/gateway:latest

            sudo docker run -d --name gateway \
              --network host \
              -e "JAVA_TOOL_OPTIONS=-Xms192m -Xmx256m" \
              -e "JWT_SECRET_KEY=${{ secrets.INFRA_JWT_SECRET_KEY }}" \
              ${{ secrets.INFRA_DOCKER_USERNAME }}/gateway:latest
            
            sudo docker image prune -f