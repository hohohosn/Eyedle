name: Deploy Chat Service to EC2
on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'chat-service/**'
jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      # 1. 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. JDK 17 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Gradle 실행 권한
      - name: Grant execute permission for gradlew
        working-directory: chat-service
        run: chmod +x gradlew

      # 4. Spring Boot 빌드
      - name: Build with Gradle
        working-directory: chat-service
        run: ./gradlew clean build -x test

      # 5. Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CHAT_DOCKER_USERNAME }}
          password: ${{ secrets.CHAT_DOCKER_PASSWORD }}

      # 6. Docker 이미지 빌드 & 푸시
      - name: Build and Push Docker Image
        working-directory: chat-service
        run: |
          docker build -t ${{ secrets.CHAT_DOCKER_USERNAME }}/chat-service:latest .
          docker push ${{ secrets.CHAT_DOCKER_USERNAME }}/chat-service:latest

      # 7. Deploy (self-hosted runner에서 직접 실행)
      - name: Deploy Chat Service
        run: |
          docker pull ${{ secrets.CHAT_DOCKER_USERNAME }}/chat-service:latest
          
          docker stop chat-service || true
          docker rm chat-service || true
          
          docker run -d \
            --name chat-service \
            -p 19200:19200 \
            --env-file ~/chat-service.env \
            ${{ secrets.CHAT_DOCKER_USERNAME }}/chat-service:latest

