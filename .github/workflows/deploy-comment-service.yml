name: Deploy Comment Service to EC2

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'comment-service/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. JDK 17 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Gradle 실행 권한
      - name: Grant execute permission for gradlew
        working-directory: comment-service
        run: chmod +x gradlew

      # 4. Spring Boot 빌드
      - name: Build with Gradle
        working-directory: comment-service
        run: ./gradlew clean build -x test

      # 5. Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.COMMENT_DOCKER_USERNAME }}
          password: ${{ secrets.COMMENT_DOCKER_PASSWORD }}

      # 6. Docker 이미지 빌드 & 푸시
      - name: Build and Push Docker Image
        working-directory: comment-service
        run: |
          docker build -t ${{ secrets.COMMENT_DOCKER_USERNAME }}/comment-service:latest .
          docker push ${{ secrets.COMMENT_DOCKER_USERNAME }}/comment-service:latest

      # 7. EC2 배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.COMMENT_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.COMMENT_EC2_SSH_KEY }}
          port: 22
          script: |
            cd ~/deploy
            
            sudo docker compose pull comment-service
            
            sudo docker compose up -d comment-service
            
            sudo docker image prune -f