version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: eyedle-es
    environment:
      - discovery.type=single-node          # 클러스터 없이 혼자 실행
      - xpack.security.enabled=false        # 개발용이라 로그인/HTTPS 끔 (편의성)
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"    # 메모리 512MB 제한
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - ./es-data:/usr/share/elasticsearch/data
      - ./es-plugins:/usr/share/elasticsearch/plugins
    networks:
      - eyedle-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1
    container_name: eyedle-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - eyedle-network

  redis:
    image: redis:alpine
    container_name: eyedle-redis
    ports:
      - "6379:6379"
    networks:
      - eyedle-network

networks:
  eyedle-network:
    driver: bridge