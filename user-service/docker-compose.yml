version: '3.8'

services:
  postgres-user:
    image: postgres:15-alpine
    container_name: user-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: userdb
      POSTGRES_PASSWORD: userdb
      POSTGRES_DB: userdb
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    networks:
      - user-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U userdb" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-user:
    image: redis:7-alpine
    container_name: user-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - user-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    restart: unless-stopped
    ports:
      - "19100:19100"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-user:5432/userdb
      - SPRING_DATASOURCE_USERNAME=userdb
      - SPRING_DATASOURCE_PASSWORD=userdb
      - SPRING_DATA_REDIS_HOST=redis-user
      - SPRING_DATA_REDIS_PORT=6379
      - JWT_SECRET_KEY=eyedle-super-secret-jwt-key-2024-change-this-in-production-minimum-256-bits
      - EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE=http://3.230.51.206:19090/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - EUREKA_INSTANCE_IP_ADDRESS=52.79.180.217
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      postgres-user:
        condition: service_healthy
      redis-user:
        condition: service_healthy
    networks:
      - user-network

networks:
  user-network:
    driver: bridge

volumes:
  postgres-user-data: