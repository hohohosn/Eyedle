server:
  port: 19300

spring:
  application:
    name: feed-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  cloud:
    inetutils:
      preferred-networks: 172.31

logging:
  level:
    org.hibernate.SQL: debug

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
#    service-url:
#      defaultZone: http://3.230.51.206:19090/eureka/
#  instance:
#    # Fargate에서 추출한 IP를 사용하도록 설정
#    prefer-ip-address: false
#    # 유레카 대시보드에 표시될 고유 ID 형식 지정
#    instance-id: feed-service
#    hostname: ${FEED_SERVICE_ALB_DNS}

feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always